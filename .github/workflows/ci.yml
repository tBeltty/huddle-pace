name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: [self-hosted, huddle-pace]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup Database Schema & Generate Client
        run: pnpm db:push
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Typecheck & Compile TypeScript
        run: pnpm build

      - name: Run automated test suite
        run: pnpm test
        env:
          DATABASE_URL: "file:./ci.db"
